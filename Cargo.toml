[workspace]
resolver = "2"
members = ["crates/whylag-core", "crates/whylag-devserver", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mateusz Glegoła"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/0xgle/whylag"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
rand = "0.8"
futures-util = "0.3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
