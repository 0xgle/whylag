[package]
name = "tauri-plugin-wifiscan"
version = "0.1.0"
edition = "2021"
publish = false
links = "tauri-plugin-wifiscan"
description = "Android Wi-Fi scanning for WhyLag"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
