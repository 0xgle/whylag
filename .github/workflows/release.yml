name: Release

# Publishing a GitHub release with a tag like v0.2.0 builds installers for
# Windows (NSIS installer), macOS (DMG, Apple Silicon and Intel) and Linux
# (AppImage + deb) and attaches them to that release.
#
# Running it by hand with a version, or pushing a tag like v0.2.0, creates that
# release (notes from
# .github/release-notes.md) and attaches the installers as well.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish as this version (e.g. v0.2.0). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # For tag pushes: create the release once, before the parallel builds.
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.make.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - id: make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "id=${{ github.event.release.id }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] || [ -n "${{ inputs.version }}" ]; then
            tag="${{ inputs.version || github.ref_name }}"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "WhyLag ${tag#v}" --notes-file .github/release-notes.md --target "$GITHUB_SHA"
            echo "id=$(gh api repos/${{ github.repository }}/releases/tags/$tag -q .id)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: |
          npm ci
          npm ci --prefix ui

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }}

      # Manual runs (Actions → Release → Run workflow) attach the installers to
      # the run instead of a release, for testing before going public.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.version == ''
        with:
          name: whylag-${{ runner.os }}-${{ strategy.job-index }}
          path: |
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/deb/*.deb
          if-no-files-found: ignore
