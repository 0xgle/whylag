name: Probe M-Lab stats
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "v0/EU/PL/asn/AS5617/2026/histogram_daily_stats.json" "v0/EU/PL/2026/histogram_daily_stats.json"; do
            curl -s -o f.json -w "%{http_code}" "https://statistics.measurementlab.net/$u" > code.txt
            echo "::notice title=$u::status $(cat code.txt) size $(wc -c < f.json)"
            echo "::notice title=head::$(head -c 900 f.json | tr '\n' ' ')"
            python3 -c "import json;d=json.load(open('f.json'));print('::notice title=shape::',type(d).__name__,len(d), list(d[0].keys()) if isinstance(d,list) else list(d.keys())[:20])" || true
          done
