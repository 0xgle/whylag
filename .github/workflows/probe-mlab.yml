name: Probe M-Lab stats
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "v0/EU/PL/2025/histogram_daily_stats.json" "v0/EU/PL/2024/histogram_daily_stats.json" "v0/EU/PL/asn/AS5617/2025/histogram_daily_stats.json" "v0/asn/AS5617/2025/histogram_daily_stats.json" "v0/EU/PL/2025/" "v0/"; do
            code=$(curl -s -o f.json -w "%{http_code}" "https://statistics.measurementlab.net/$u")
            echo "::notice title=$u::status $code size $(wc -c < f.json) $(head -c 400 f.json | tr '\n' ' ')"
          done
          for b in statistics-mlab-oti statistics-mlab-sandbox; do
            code=$(curl -s -o l.xml -w "%{http_code}" "https://storage.googleapis.com/$b?prefix=v0/EU/PL/&delimiter=/")
            echo "::notice title=list $b::status $code $(grep -o '<Prefix>[^<]*</Prefix>' l.xml | head -40 | tr '\n' ' ')"
          done
          dig +short CNAME statistics.measurementlab.net | sed 's/^/::notice title=cname::/'
