name: Android

# Builds the Android app (tablets and phones). Manual runs keep the APK as a
# downloadable artifact; releases attach it to the GitHub release.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_id:
        type: string
        required: false
    secrets:
      ANDROID_KEYSTORE:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships the Android SDK; add the NDK and build tools.
      - name: Android SDK and NDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-36" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "NDK_HOME=$sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Install JS dependencies
        run: |
          npm ci
          npm ci --prefix ui

      - name: Generate the Android project
        run: npm run tauri android init -- --ci 2>&1 | tee init.log

      - name: Build APK
        run: |
          set -o pipefail
          npm run tauri android build -- --apk --target aarch64 --target armv7 --target x86_64 --ci 2>&1 | tee build.log

      # Logs are long; surface the actual compiler errors as annotations.
      - name: Report build errors
        if: failure()
        run: |
          for f in init.log build.log; do
            [ -f "$f" ] || continue
            msg=$(grep -E "^error|error\[|^e: |What went wrong|FAILURE:|> Task .* FAILED|Caused by|cannot find|unresolved|not found|Dependency|requires|compileSdk" -A8 "$f" | head -c 6000 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            [ -n "$msg" ] && echo "::error title=$f::$msg"
          done
          true

      - name: Sign APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apk=$(find src-tauri/gen/android -name "*-unsigned.apk" | head -1)
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > whylag.jks
            pass="$KEYSTORE_PASSWORD"
          else
            # No release key yet: a throwaway key still makes an installable APK.
            pass=$(openssl rand -hex 16)
            keytool -genkeypair -keystore whylag.jks -storepass "$pass" -keypass "$pass" -alias whylag -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=WhyLag" > /dev/null
            echo "::warning::Signed with a temporary key. Add ANDROID_KEYSTORE so updates install over earlier versions."
          fi
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f 4 "$apk" aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks whylag.jks --ks-pass "pass:$pass" --ks-key-alias whylag --out WhyLag-android.apk aligned.apk
          ls -la WhyLag-android.apk

      # Without the permanent key the APK stays a test build: an app signed
      # with a throwaway key cannot be updated later without reinstalling.
      - uses: actions/upload-artifact@v4
        if: inputs.release_id == '' || env.HAS_KEY != 'true'
        with:
          name: whylag-android
          path: WhyLag-android.apk

      - name: Attach to release
        if: inputs.release_id != '' && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh api repos/${{ github.repository }}/releases/${{ inputs.release_id }} -q .tag_name)
          version=${tag#v}
          cp WhyLag-android.apk "WhyLag_${version}_android.apk"
          gh release upload "$tag" "WhyLag_${version}_android.apk" --clobber
