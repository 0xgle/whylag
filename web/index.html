<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhyLag — Why is my internet lagging?</title>
    <meta name="description" content="A 30-second test that measures your speed and the lag you feel under load, then tells you what to fix." />
    <meta property="og:title" content="WhyLag — Why is my internet lagging?" />
    <meta property="og:description" content="Test your speed and lag under load in 30 seconds, then find out what to fix." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="./">
        <img src="./icon.svg" width="30" height="30" alt="" />
        <span>WhyLag</span>
      </a>
      <nav class="links">
        <a href="./ranking.html" id="rankNav" data-t="navRanking" hidden></a>
      </nav>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en">EN</button>
        <button data-lang="pl">PL</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <h1 data-t="title"></h1>
        <p class="lead" data-t="lead"></p>
      </section>

      <section class="meter" aria-live="polite">
        <div class="readings">
          <div class="reading">
            <span class="label" data-t="download"></span>
            <span class="value"><b id="down">—</b><small>Mb/s</small></span>
          </div>
          <div class="reading">
            <span class="label" data-t="upload"></span>
            <span class="value"><b id="up">—</b><small>Mb/s</small></span>
          </div>
          <div class="reading">
            <span class="label" data-t="lag"></span>
            <span class="value"><b id="lag">—</b><small>ms</small></span>
            <span class="sub" id="idle"></span>
          </div>
        </div>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="controls">
          <button class="primary" id="start" data-t="start"></button>
          <span class="phase" id="phase"></span>
        </div>
        <p class="consent" data-t="consent"></p>
        <label class="share-opt" id="shareOpt" hidden>
          <input type="checkbox" id="shareRanking" checked />
          <span data-t="shareRanking"></span>
        </label>
        <p class="error" id="error" hidden></p>
      </section>

      <section class="result" id="result" hidden>
        <div class="grade" id="grade"></div>
        <div class="verdict">
          <span class="label" data-t="grade"></span>
          <h2 id="verdict"></h2>
          <ul id="tips"></ul>
          <div class="controls">
            <button class="primary" id="share" data-t="share"></button>
            <button id="again" data-t="again"></button>
          </div>
          <p class="ranked" id="ranked" hidden></p>
          <p class="server" id="server"></p>
        </div>
      </section>

      <section class="app">
        <div>
          <h2 data-t="appTitle"></h2>
          <p data-t="appBody"></p>
        </div>
        <a class="primary cta" href="https://github.com/0xgle/whylag/releases/latest" data-t="appCta"></a>
      </section>
    </main>

    <footer><span data-t="footer"></span></footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
